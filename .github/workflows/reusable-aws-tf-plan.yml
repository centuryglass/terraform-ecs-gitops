# Reusable: terraform plan for the AWS stack, posted as a PR comment.
name: reusable-aws-tf-plan

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to run against.
        required: true
        type: string
        default: prod

permissions:
  id-token: write      # AWS OIDC
  contents: read
  pull-requests: write # post the plan comment

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_PLAN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # Prevents stdout pollution when saving plan

      - name: Terraform Init, Format, Validate
        working-directory: ./${{ vars.TF_DIR }}
        run: |
          terraform init
          terraform fmt -recursive -diff
          terraform validate

      - name: Terraform Plan
        id: plan
        working-directory: ./${{ vars.TF_DIR }}
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
        continue-on-error: true

      - name: Upload plan output as an artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-aws-${{ github.event.pull_request.number }}
          path: ${{ vars.TF_DIR }}/plan.txt
          retention-days: 5

      - name: Post plan as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = `${{ vars.TF_DIR }}/plan.txt`;
            let planText = fs.readFileSync(path, 'utf8');
            // GitHub comments cap out around 65536 chars; leave headroom.
            const maxLen = 60000;
            if (planText.length > maxLen) {
              planText = planText.slice(0, maxLen) + '\n\n... (truncated, see workflow artifact for full plan)';
            }
            const body = [
              '### Terraform Plan (AWS / ${{ inputs.environment }})',
              `Result: \`${{ steps.plan.outcome }}\``,
              '',
              '<details><summary>Click to expand plan output</summary>',
              '',
              '```hcl',
              planText,
              '```',
              '',
              '</details>'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
