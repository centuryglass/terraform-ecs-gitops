# Caller: on a dev-branch webapp or hosting-config change, deploy static
# frontend to Firebase. firebase.json is included so hosting-config changes
# (rewrites, cache headers) redeploy too — it lives at the repo root, not under
# webapp/.
name: gcp-frontend

on:
  push:
    branches: [dev]
    paths:
      - 'webapp/**'
      - 'firebase.json'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  call:
    uses: ./.github/workflows/reusable-gcp-frontend.yml
    with:
      environment: dev
    secrets: inherit
