# Reusable: terraform apply for the AWS stack (rolls the ECS service).
name: reusable-aws-tf-apply

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub Environment to run against.
        required: true
        type: string
        default: prod

permissions:
  id-token: write  # AWS OIDC
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.ROLE_APPLY }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false  # aws-safe-apply.sh parses raw `terraform show -json`

      # Wrapper around `terraform apply` (init + plan + apply + outputs). When the
      # plan tears down the CloudFront VPC origin it disassociates it from the
      # distribution first, otherwise DeleteVpcOrigin 409s. See the script header
      # and the note above aws_cloudfront_vpc_origin.alb in edge.tf.
      - name: Terraform Apply (VPC-origin-safe)
        env:
          TF_DIR: ${{ vars.TF_DIR }}
        run: bash scripts/aws-safe-apply.sh -auto-approve -no-color
