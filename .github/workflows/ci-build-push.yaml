name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'app/**'
  workflow_dispatch:
    inputs:
      open_pr:
        description: 'Open the deploy PR after pushing the image'
        type: boolean
        default: true

permissions:
  id-token: write       # Required for AWS OIDC authentication
  contents: write       # Required to push the new branch
  pull-requests: write  # Required to create the PR

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate variables
        id: vars
        run: |
          # Get 7-character commit hash
          SHORT_SHA=$(git rev-parse --short HEAD)
          IMAGE_TAG="${SHORT_SHA}"

          echo "IMAGE_TAG=${IMAGE_TAG}" >> $GITHUB_ENV
          echo "BRANCH_NAME=${GITHUB_REF#refs/heads/}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

          # Capture the currently-deployed tag (if any) before overwriting,
          # so the PR body can link a diff between the two.
          if [ -f ./infra/live/image.auto.tfvars ]; then
            PREV_TAG=$(grep -oP '(?<=image_tag = ")[^"]+' ./infra/live/image.auto.tfvars || true)
          fi
          echo "PREV_TAG=${PREV_TAG}" >> $GITHUB_ENV


      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.PUSH_ROLE_ARN_GITHUB }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, tag, and push Docker image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/waypoint-build-imgs:${{ env.IMAGE_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            IMAGE_TAG=${{ env.IMAGE_TAG }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Terraform image variable
        run: |
          FILE=./infra/live/image.auto.tfvars
          if [ ! -f "$FILE" ]; then
            echo 'image_tag = "${{ env.IMAGE_TAG }}"' > "$FILE"
          elif grep -q '^image_tag[[:space:]]*=' "$FILE"; then
            sed -i "s|^image_tag[[:space:]]*=.*|image_tag = \"${{ env.IMAGE_TAG }}\"|" "$FILE"
          else
            echo 'image_tag = "${{ env.IMAGE_TAG }}"' >> "$FILE"
          fi

      - name: Create Pull Request
        if: github.event_name != 'workflow_dispatch' || inputs.open_pr
        uses: peter-evans/create-pull-request@v6
        with:
          # No `token:` override — uses the default GITHUB_TOKEN, which can
          # open PRs now that the repo allows Actions to create and approve
          # them. Note this PR's `pull_request` event won't auto-trigger
          # infra-plan.yaml: GitHub doesn't fire workflows off GITHUB_TOKEN's
          # own actions, to prevent recursive runs. Run infra-plan manually
          # (workflow_dispatch) against this branch to get a plan comment.
          commit-message: "Deploy ${{ env.IMAGE_TAG }}"
          branch: deploy-${{ env.IMAGE_TAG }}
          base: ${{ env.BRANCH_NAME }}
          title: "Deploy ${{ env.IMAGE_TAG }}"
          body: |
            Bumps `image_tag` to `${{ env.IMAGE_TAG }}`.

            ${{ env.PREV_TAG && format('**App changes:** {0}/{1}/compare/{2}...{3}', github.server_url, github.repository, env.PREV_TAG, env.IMAGE_TAG) || '_No previous deployed tag found, nothing to diff against._' }}

            This PR won't get an automatic `terraform plan` comment — it's
            opened with the default `GITHUB_TOKEN`, which doesn't trigger
            other workflows. Run `infra-plan` manually against this branch
            (Actions → Terraform Plan → Run workflow) before merging.
